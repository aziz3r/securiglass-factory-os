# ============================================================================
# SecuriGlass Factory OS - Configuration pgAudit (IEC 62443 / OWASP ASVS)
# ============================================================================

# Activation du module pgAudit dans postgresql.conf
# shared_preload_libraries = 'pgaudit'

# Niveaux de journalisation pour la traçabilité des opérations sensibles
pgaudit.log = 'role, ddl, write, function'

# Journalisation des instructions SQL avec leurs arguments de requête
pgaudit.log_parameter = on

# Masquage des catalogues internes pour ne pas saturer les logs système
pgaudit.log_catalog = off

# Enregistrement du niveau de sévérité du message
pgaudit.log_level = 'log'

# Règle de journalisation par rôle pour cibler les comptes à hauts privilèges
pgaudit.role = 'role_super_admin'
