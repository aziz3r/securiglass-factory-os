[alembic]
# Chemin relatif à ce fichier (database/migrations/)
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os

# Le DSN n'est jamais écrit ici : il est lu depuis l'environnement par env.py
# (SECURIGLASS_DATABASE_URL ou DATABASE_URL). Aucun secret dans le dépôt.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
