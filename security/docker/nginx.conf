# =============================================================================
# SecuriGlass Factory OS - Configuration nginx pour SPA React (Vite)
# =============================================================================
# Cible : nginxinc/nginx-unprivileged:alpine (UID/GID 101, ecoute 8080).
# Compatible racine en lecture seule : tous les chemins temporaires et le PID
# sont places sous /tmp, lequel doit etre monte en tmpfs :
#   docker run --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m ...
# =============================================================================

# Pas de directive "user" : le processus tourne deja sous UID 101 (non-root).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Journaux vers la sortie standard (collecte Docker / SIEM).
    access_log /dev/stdout combined;

    # Chemins temporaires inscriptibles malgre la racine read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression : uniquement des types statiques de l'application.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --- En-tetes de securite (OWASP ASVS / IEC 62443-3-3) --------------
        # "always" : en-tetes presents aussi sur les reponses d'erreur.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Sonde de sante pour Docker / orchestrateur (pas de log).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Assets hashes par Vite : cache long, immuable.
        # NB : pas de add_header ici, sinon les en-tetes de securite du bloc
        # serveur ne seraient plus herites (regle d'heritage de nginx).
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # index.html jamais mis en cache (les assets, eux, sont hashes).
        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        # Routage SPA : toute route inconnue retombe sur index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
