# =============================================================================
# SecuriGlass Factory OS - Regles Semgrep maison
# =============================================================================
# Utilisation :
#   semgrep scan --config p/ci --config security/semgrep.yml \
#     --severity ERROR --error services/backend-api/app
#
# Ces regles completent le pack p/ci avec des interdictions explicites du projet
# (IEC 62443-4-1 / OWASP ASVS / SLSA). Severite ERROR = bloquant en CI.
# =============================================================================

rules:
  # ---------------------------------------------------------------------------
  # 1. Pas de eval / exec dynamique (Python)
  # ---------------------------------------------------------------------------
  - id: securiglass-no-eval-python
    languages: [python]
    severity: ERROR
    message: >-
      Execution de code dynamique (eval/exec) interdite : risque d'injection de
      code et de contournement des contrôles ABAC. Utiliser un parseur sûr
      (ast.literal_eval, json.loads) ou une table de correspondance explicite.
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  # ---------------------------------------------------------------------------
  # 2. Pas de eval dynamique (JavaScript / TypeScript)
  # ---------------------------------------------------------------------------
  - id: securiglass-no-eval-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Execution de code dynamique (eval / new Function) interdite dans la SPA :
      incompatible avec la CSP stricte et risque d'XSS.
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  # ---------------------------------------------------------------------------
  # 3. Pas de secret en dur (Python)
  # ---------------------------------------------------------------------------
  - id: securiglass-hardcoded-secret-python
    languages: [python]
    severity: ERROR
    message: >-
      Secret potentiellement en dur (mot de passe, cle API, token). Les secrets
      doivent provenir de variables d'environnement ou d'un coffre (Vault/SOPS).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
      subcategory: [vuln]
      technology: [python]
    patterns:
      - pattern-either:
          - pattern: $VAR = "$VALUE"
          - pattern: '$VAR: $TYPE = "$VALUE"'
          - pattern: $OBJ["$KEY"] = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^.*(password|passwd|pwd|secret|api[_-]?key|token|private[_-]?key).*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!.*(example|placeholder|changeme|change_me|replace|dummy|fake|your_|xxxx|redacted|test-only|ci-only)).{12,}$
      - focus-metavariable: $VALUE

  - id: securiglass-hardcoded-secret-subscript-python
    languages: [python]
    severity: ERROR
    message: >-
      Secret potentiellement en dur dans un dictionnaire indexe par un nom
      sensible. Utiliser une source de configuration sécurisée.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
      subcategory: [vuln]
      technology: [python]
    patterns:
      - pattern: $OBJ["$KEY"] = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^.*(password|passwd|secret|api[_-]?key|token|private[_-]?key).*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!.*(example|placeholder|changeme|change_me|replace|dummy|fake|your_|xxxx|redacted|test-only|ci-only)).{8,}$
      - focus-metavariable: $VALUE

  # ---------------------------------------------------------------------------
  # 4. Pas de secret en dur (JavaScript / TypeScript)
  # ---------------------------------------------------------------------------
  - id: securiglass-hardcoded-secret-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Secret potentiellement en dur dans le frontend. Les secrets ne doivent
      JAMAIS être embarqués dans un bundle client (Vite les rend publics).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
      subcategory: [vuln]
      technology: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $VAR = "$VALUE"
          - pattern: $VAR = '$VALUE'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^.*(password|passwd|secret|api[_-]?key|apikey|token|private[_-]?key).*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!.*(example|placeholder|changeme|replace|dummy|fake|your_|xxxx|redacted)).{12,}$
      - focus-metavariable: $VALUE

  # ---------------------------------------------------------------------------
  # 5. Pas de subprocess avec shell=True (Python)
  # ---------------------------------------------------------------------------
  - id: securiglass-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess avec shell=True interdit : risque d'injection de commandes.
      Passer une liste d'arguments sans shell (ou utiliser shlex.split).
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [python]
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: subprocess.$FUNC(..., shell=True)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  # ---------------------------------------------------------------------------
  # 6. Pas de requete SQL concatenee (Python)
  # ---------------------------------------------------------------------------
  - id: securiglass-sql-string-concatenation
    languages: [python]
    severity: ERROR
    message: >-
      Requête SQL construite par concatenation / f-string / format : injection
      SQL probable. Utiliser des requêtes paramétrées ($1, %s) sans
      interpolation de chaîne.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
      subcategory: [vuln]
      technology: [python]
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD("..." + $X, ...)
          - pattern: $DB.$METHOD(f"...", ...)
          - pattern: $DB.$METHOD("...".format(...), ...)
          - pattern: $DB.$METHOD("..." % $X, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i)^(execute|executemany|fetch|fetchrow|fetchval|fetchone|fetchall)$

  # ---------------------------------------------------------------------------
  # 7. Pas de verification TLS desactivee
  # ---------------------------------------------------------------------------
  - id: securiglass-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: >-
      Vérification TLS désactivée (verify=False / contexte non vérifié) :
      exposition au MITM, incompatible mTLS/IEC 62443-3-3 SR 1.9.
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [python]
    pattern-either:
      - pattern: $CLIENT.$METHOD(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: urllib3.disable_warnings(...)

  - id: securiglass-tls-verify-disabled-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Vérification TLS désactivée (rejectUnauthorized: false) : exposition au
      MITM.
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [javascript, typescript]
    pattern-either:
      - pattern: '$OPTS = {..., rejectUnauthorized: false, ...}'
      - pattern: '$OPTS = {..., rejectUnauthorized: false}'
      - pattern: 'process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"'

  # ---------------------------------------------------------------------------
  # 8. Pas de MD5 / SHA1 pour la securite
  # ---------------------------------------------------------------------------
  - id: securiglass-weak-hash
    languages: [python]
    severity: ERROR
    message: >-
      MD5/SHA-1 interdit pour tout usage de sécurité (IEC 62443 / OWASP ASVS
      V6.2). Utiliser SHA-256+ ou Argon2id pour les mots de passe.
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [python]
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)

  - id: securiglass-weak-hash-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      MD5/SHA-1 interdit pour tout usage de sécurité. Utiliser SHA-256+ ou
      Argon2id (côté serveur).
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: [vuln]
      technology: [javascript, typescript]
    pattern-either:
      - pattern: crypto.createHash("md5", ...)
      - pattern: crypto.createHash("sha1", ...)
      - pattern: crypto.createHash('md5', ...)
      - pattern: crypto.createHash('sha1', ...)
