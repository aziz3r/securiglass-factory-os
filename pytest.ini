[pytest]
# Configuration racine : garantit que la suite s'exécute de façon identique
# depuis la racine du dépôt ou depuis services/backend-api.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = services/backend-api services/ot-edge-gateway
addopts = -ra --strict-markers
markers =
    unit: Tests unitaires sans base de données
    security: Tests de sécurité et attaques offensives
    integration: Tests d'intégration et schéma
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
