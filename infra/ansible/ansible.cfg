# =============================================================================
# SecuriGlass Factory OS - Configuration Ansible
# =============================================================================
# Ce fichier est lu automatiquement lorsqu'Ansible est execute depuis
# infra/ansible/. Il ne contient aucun secret.
# =============================================================================

[defaults]
# Copier inventory.example.ini vers inventory.ini (non versionne) et l'adapter.
inventory = ./inventory.ini
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
deprecation_warnings = True
interpreter_python = auto_silent
gathering = smart
fact_caching = memory
stdout_callback = default
callbacks_enabled = profile_tasks
forks = 10

# Identite Vault (OPT-IN). Le fichier de mot de passe ne doit JAMAIS etre
# versionne. Decommenter une fois le fichier cree hors depot :
#   ansible-vault create group_vars/all/vault.yml --vault-id default@~/.ansible/securiglass-vault-id
# ou, sans modifier ce fichier :
#   ANSIBLE_VAULT_IDENTITY_LIST=default@~/.ansible/securiglass-vault-id ansible-playbook ...
# Laisser commente par defaut : une identite declaree mais absente fait echouer
# TOUTES les invocations Ansible (y compris --syntax-check).
# vault_identity_list = default@~/.ansible/securiglass-vault-id

# NOTE : `no_log` n'est PAS une option globale d'ansible.cfg (c'est un keyword
# de tache ou de play). Les taches sensibles du role portent explicitement
# `no_log: true` (voir roles/cis_linux/tasks/*.yml) et le playbook expose la
# variable `cis_no_log`.

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
