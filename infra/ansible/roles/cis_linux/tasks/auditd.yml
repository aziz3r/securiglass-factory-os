---
# =============================================================================
# CIS 4.1 - auditd : journalisation des evenements de securite
# =============================================================================
# Rappel : auditd ne fonctionne pas dans un conteneur non privilegie et peut
# necessiter un redemarrage de l'hote pour charger les regles au boot.
# =============================================================================

- name: "CIS 4.1.1 - deployer les regles d'audit SecuriGlass"
  ansible.builtin.template:
    src: audit.rules.j2
    dest: "{{ cis_auditd_rules_path }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify:
    - Recharger les regles auditd
    - Redemarrer auditd
  tags: [auditd]

- name: "CIS 4.1.2 - activer et demarrer auditd"
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  tags: [auditd]

- name: "CIS 4.1.3 - verifier l'etat du sous-systeme d'audit"
  ansible.builtin.command: auditctl -s
  register: cis_audit_status
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  failed_when: false
  no_log: "{{ cis_no_log }}"
  tags: [auditd]
