# =============================================================================
# SecuriGlass Factory OS - Inventaire d'exemple (NE PAS UTILISER TEL QUEL)
# =============================================================================
# Copier vers inventory.ini (non versionne) et remplacer l'hote d'exemple.
# L'adresse 192.0.2.10 appartient a TEST-NET-1 (RFC 5737) : non routable.
# =============================================================================

[linux_hardening]
# Hote de demonstration : remplacer par les serveurs reels (Purdue 3/4).
glass-srv-01 ansible_host=192.0.2.10 ansible_user=ansible

[linux_hardening:vars]
ansible_python_interpreter=/usr/bin/python3
# Verifier l'empreinte de l'hote avant le premier passage :
# ssh-keyscan -t ed25519 192.0.2.10
ansible_ssh_common_args=-o StrictHostKeyChecking=yes -o ConnectTimeout=10
# ansible_ssh_private_key_file=~/.ssh/securiglass_ansible_ed25519
