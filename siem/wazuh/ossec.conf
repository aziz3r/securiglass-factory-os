<?xml version="1.0" encoding="UTF-8"?>
<!--
  ==========================================================================
  SecuriGlass Factory OS - Wazuh Manager (ossec.conf durci)
  ==========================================================================
  Principes :
    - FIM temps reel sur /etc, /usr/bin, /usr/sbin, /etc/ssh et la config SOC.
    - Collecte des journaux applicatifs normalises (JSON SecuriGlass, pgAudit,
      Suricata EVE) depuis /var/log/securiglass (volume en lecture seule).
    - Detection reseau OT : Modbus/TCP 5020, sous-reseaux 10.10.30.0/24
      (gateway) et 10.10.20.0/24 (salle de controle).
    - Pas d'Active Response automatique : confinement manuel par l'operateur
      (evite toute action destructive sur un procede verrier).
    - Aucun secret dans ce fichier : les mots de passe viennent de
      l'environnement du conteneur (voir docker-compose.yml).
  ==========================================================================
-->
<ossec_config>

  <!-- ===================== GLOBAL ===================== -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <white_list>127.0.0.1</white_list>
    <white_list>10.10.20.0/24</white_list>
    <white_list>10.10.30.0/24</white_list>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- ===================== COLLECTE AGENTS / OT ===================== -->
  <!-- Agents Wazuh (postes IT et passerelle edge) -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Journaux syslog des equipements OT (automates, switches industriels).
       Restreint aux deux sous-reseaux Purdue 2/3 : aucun equipement
       d'atelier (Purdue 0/1) ne doit pouvoir envoyer directement au SOC. -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.10.20.0/24,10.10.30.0/24</allowed-ips>
  </remote>

  <!-- ===================== FIM ===================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc,/etc/ssh</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/ossec/etc/rules,/var/ossec/etc/decoders</directories>
    <!-- Le flux audit.jsonl est append-only et change en permanence : on ne
         surveille pas son contenu via FIM (bruit), mais les manifestes
         scelles quotidiens (audit-YYYYMMDD.jsonl.sha256) deposes ici. -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/log/securiglass/sealed</directories>

    <!-- Ne jamais collecter le contenu des secrets dans les diffs FIM -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff>/etc/ssh/ssh_host_rsa_key</nodiff>
    <nodiff>/etc/ssh/ssh_host_ed25519_key</nodiff>
    <nodiff>/etc/ssh/ssh_host_ecdsa_key</nodiff>
    <nodiff>/var/ossec/etc/client.keys</nodiff>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/hosts</ignore>
    <ignore>/etc/hostname</ignore>
    <ignore>/usr/bin/.*\.pyc$</ignore>
    <ignore>/etc/ld.so.cache</ignore>
    <ignore type="sregex">\.log$</ignore>
  </syscheck>

  <!-- ===================== ROOTCHECK ===================== -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>no</check_dev>
    <check_sys>no</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>no</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- Posture et inventaire : desactives pour une pile legere (PoC).
       Les activer sur un SOC de production (SCA + syscollector). -->
  <sca>
    <enabled>no</enabled>
  </sca>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <!-- Pas de flux de vulnerabilites : le SOC est isole du reseau IT/Internet.
       Mettre a jour les flux hors ligne (miroir interne) si necessaire. -->
  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>no</index-status>
  </vulnerability-detection>

  <!-- ===================== INDEXATION ===================== -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

  <!-- ===================== COLLECTE APPLICATIVE ===================== -->
  <!-- 1) Audit applicatif SecuriGlass : JSON Lines, une ligne par evenement.
         Champs attendus : source, event_type, actor_username, actor_ip,
         outcome, action, resource, details.*, prev_log_hash, current_hash. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/securiglass/audit.jsonl</location>
    <label key="soc.source">securiglass-audit</label>
  </localfile>

  <!-- 2) Journaux applicatifs FastAPI (texte, niveau INFO/WARNING). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/securiglass/backend-api.log</location>
  </localfile>

  <!-- 3) Journaux PostgreSQL/pgAudit (lignes "AUDIT:"). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/securiglass/postgresql.log</location>
  </localfile>

  <!-- 4) Suricata EVE JSON (capteur reseau OT, optionnel).
         Fournit les evenements Modbus/TCP (dest_port 5020) et les flux. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/securiglass/suricata/eve.json</location>
    <label key="soc.source">suricata-eve</label>
  </localfile>

  <!-- ===================== REGLES ET DECODEURS ===================== -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

</ossec_config>
